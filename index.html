<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
<meta charset="utf-8">
<title>Sunset Clock</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="description" content="A sunset-to-sunset clock with a sky that follows the real sun, plus prayer times.">
<meta name="theme-color" content="#0a1030" id="themeColor">
<meta name="color-scheme" content="dark">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">

<meta name="apple-mobile-web-app-title" content="Sunset Clock">
<link rel="preconnect" href="https://fonts.googleapis.com">

<style>
  :root {
    --ink: #fff;
    --ink-soft: rgba(255,255,255,.72);
    --glass: rgba(8,12,36,.34);
    --line: rgba(255,255,255,.16);
    --accent: #ffd27a;
    --sheet: #121a3d;
    color-scheme: dark;
    box-sizing: border-box;
    padding-top: env(safe-area-inset-top, 0px);
    padding-bottom: env(safe-area-inset-bottom, 0px);
  }
  html { scroll-padding-top: env(safe-area-inset-top, 0px); }
  *, *::before, *::after { box-sizing: inherit; }
  html, body { margin: 0; min-height: 100%; }
  body {
    background: #0a1030;
    color: var(--ink);
    font-family: 'Outfit', system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
    -webkit-font-smoothing: antialiased;
    overflow-x: hidden;
  }
  html[lang="fa"] body { font-family: 'Vazirmatn', 'Outfit', system-ui, Tahoma, sans-serif; }

  #sky, #glow, #stars { position: fixed; inset: 0; pointer-events: none; }
  #sky { z-index: 0; background: linear-gradient(180deg, #0a1030, #0a1030); }
  #glow { z-index: 1; opacity: 0; background: radial-gradient(ellipse 120% 55% at 50% 100%, rgba(255,160,80,.85), rgba(255,160,80,0) 70%); }
  #stars { z-index: 1; opacity: 0; }
  #stars i { position: absolute; border-radius: 50%; background: #fff; animation: tw 4s ease-in-out infinite; }
  @keyframes tw { 0%,100% { opacity: .9 } 50% { opacity: .25 } }
  @media (prefers-reduced-motion: reduce) { #stars i { animation: none; } }

  .wrap { position: relative; z-index: 2; max-width: 520px; margin: 0 auto; padding: 14px 16px 40px; }
  .top { display: flex; justify-content: space-between; align-items: center; gap: 10px; }
  .chip {
    background: var(--glass); border: 1px solid var(--line); color: var(--ink);
    padding: 9px 14px; border-radius: 999px; font: inherit; font-size: 14px; cursor: pointer;
    backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px);
    display: inline-flex; align-items: center; gap: 8px; min-width: 0; max-width: 72%;
  }
  .chip span.t { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .chip:active { transform: scale(.97); }

  .hero { text-align: center; padding: 18px 0 6px; }
  .phase { font-size: 12.5px; letter-spacing: .14em; text-transform: uppercase; opacity: .9; min-height: 18px; }
  html[lang="fa"] .phase { letter-spacing: 0; text-transform: none; font-size: 14px; }
  .ring { position: relative; width: min(84vw, 340px); aspect-ratio: 1; margin: 12px auto 16px; }
  .ring svg { position: absolute; inset: 0; width: 100%; height: 100%; overflow: visible; }
  .ring-in { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 8px; padding: 0 10%; }
  .label { font-size: 14px; color: var(--ink-soft); }
  .digits {
    font-size: min(14vw, 60px); font-weight: 200; direction: ltr; unicode-bidi: isolate;
    font-variant-numeric: tabular-nums; letter-spacing: .02em; line-height: 1;
    text-shadow: 0 2px 18px rgba(0,0,0,.25);
  }
  .sub { font-size: 12.5px; color: var(--ink-soft); line-height: 1.5; }
  .note { font-size: 12px; color: var(--accent); margin: 6px auto 0; max-width: 300px; }

  .upnext { display: block; width: fit-content; max-width: 100%; margin: 0 auto 14px; padding: 8px 14px; font-size: 14px; line-height: 1.5; background: var(--glass); border: 1px solid var(--line); border-radius: 16px; backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px); }
  .ltr { direction: ltr; unicode-bidi: isolate; font-variant-numeric: tabular-nums; }
  .tools { display: flex; gap: 8px; align-items: center; }
  .chip.icon { padding: 9px 12px; }
  .chip[aria-pressed="true"] { background: rgba(255,210,122,.28); border-color: rgba(255,210,122,.6); }
  #locBtn { max-width: calc(100% - 150px); }
  .seg { display: inline-flex; padding: 4px; gap: 2px; background: var(--glass); border: 1px solid var(--line); border-radius: 999px; backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px); }
  .seg button { background: transparent; color: var(--ink-soft); border: 0; font: inherit; font-size: 13.5px; padding: 8px 16px; border-radius: 999px; cursor: pointer; }
  .seg button[aria-pressed="true"] { background: rgba(255,255,255,.22); color: var(--ink); }

  .dates { margin-top: 18px; line-height: 1.6; }
  .dates .h { font-size: 17px; font-weight: 400; }
  .dates .c { font-size: 13.5px; color: var(--ink-soft); }

  .card { margin-top: 14px; padding: 16px; background: var(--glass); border: 1px solid var(--line); border-radius: 20px; backdrop-filter: blur(14px); -webkit-backdrop-filter: blur(14px); }
  .card h2 { margin: 0 0 12px; font-size: 12.5px; font-weight: 600; letter-spacing: .12em; text-transform: uppercase; opacity: .85; }
  html[lang="fa"] .card h2 { letter-spacing: 0; text-transform: none; font-size: 15px; }
  .card-head { display: flex; align-items: center; justify-content: space-between; gap: 10px; flex-wrap: wrap; margin-bottom: 4px; }
  .card-head h2 { margin: 0; }

  .chart { direction: ltr; }
  .chart svg { width: 100%; height: auto; display: block; }
  .chart-foot { position: relative; height: 34px; font-size: 12px; color: var(--ink-soft); font-variant-numeric: tabular-nums; }
  .chart-foot span { position: absolute; top: 6px; white-space: nowrap; }
  .chart-foot .l { left: 0; } .chart-foot .r { right: 0; } .chart-foot .m { transform: translateX(-50%); }

  .sels { display: flex; gap: 8px; flex-wrap: wrap; margin: 6px 0 12px; }
  select, input {
    background: rgba(255,255,255,.1); color: var(--ink); border: 1px solid var(--line);
    border-radius: 10px; padding: 8px 10px; font: inherit; font-size: 14px; max-width: 100%;
  }
  select option { color: #111; background: #fff; }
  .sels select { flex: 1 1 140px; font-size: 13px; }

  .nextbar { display: flex; justify-content: space-between; align-items: baseline; gap: 10px; padding: 2px 4px 12px; font-size: 14px; color: var(--ink-soft); }
  .nextbar b { color: var(--ink); font-weight: 600; }
  .nextbar .cd { color: var(--accent); font-size: 18px; font-variant-numeric: tabular-nums; direction: ltr; unicode-bidi: isolate; }
  .rows { display: grid; gap: 4px; }
  .row { display: flex; justify-content: space-between; align-items: center; padding: 10px 12px; border-radius: 12px; font-size: 16px; }
  .row .tm { font-variant-numeric: tabular-nums; direction: ltr; unicode-bidi: isolate; font-weight: 400; }
  .row.passed { opacity: .5; }
  .row.next { background: rgba(255,210,122,.16); outline: 1px solid rgba(255,210,122,.5); }
  .row.minor { font-size: 14px; color: var(--ink-soft); }
  .row .vals { display: flex; align-items: baseline; gap: 12px; direction: ltr; unicode-bidi: isolate; }
  .row .lc { font-size: 12.5px; color: var(--ink-soft); font-variant-numeric: tabular-nums; min-width: 3.2em; text-align: right; }
  .pnote { font-size: 12.5px; color: var(--ink-soft); margin: 0 4px 10px; }

  details { border-top: 1px solid var(--line); padding: 12px 0; }
  details:first-of-type { border-top: 0; padding-top: 0; }
  summary { cursor: pointer; font-weight: 600; font-size: 15px; list-style: none; display: flex; justify-content: space-between; align-items: center; }
  summary::-webkit-details-marker { display: none; }
  summary::after { content: '+'; opacity: .7; font-size: 18px; }
  details[open] summary::after { content: '–'; }
  details p { margin: 10px 0 0; font-size: 14px; line-height: 1.7; color: var(--ink-soft); }
  footer { text-align: center; font-size: 12px; color: var(--ink-soft); margin: 22px 0 0; opacity: .8; }

  dialog { padding: 0; border: 1px solid var(--line); border-radius: 22px; background: var(--sheet); color: var(--ink); width: calc(100% - 32px); max-width: 420px; font: inherit; }
  dialog::backdrop { background: rgba(0,0,0,.55); backdrop-filter: blur(4px); }
  .sheet { padding: 20px; display: grid; gap: 14px; }
  .sheet h3 { margin: 0; font-size: 18px; font-weight: 600; }
  .sheet label { display: grid; gap: 6px; font-size: 13px; color: var(--ink-soft); }
  .sheet select, .sheet input { width: 100%; font-size: 15px; padding: 10px 12px; }
  .grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  .btn { font: inherit; font-size: 15px; padding: 11px 16px; border-radius: 12px; border: 1px solid var(--line); background: rgba(255,255,255,.08); color: var(--ink); cursor: pointer; }
  .btn.primary { background: var(--accent); color: #1a1a2e; border-color: transparent; font-weight: 600; }
  .actions { display: flex; gap: 10px; justify-content: flex-end; }
  .msg { font-size: 13px; color: var(--accent); min-height: 18px; }
  [hidden] { display: none !important; }
</style>
</head>
<body>
<div id="sky"></div>
<div id="glow"></div>
<div id="stars" aria-hidden="true"></div>

<main class="wrap">
  <header class="top">
    <button class="chip" id="locBtn" aria-haspopup="dialog"><span aria-hidden="true">📍</span><span class="t" id="locName">…</span></button>
    <div class="tools">
      <button class="chip icon" id="installBtn" hidden>⬇</button>
      <button class="chip icon" id="liveBtn" aria-pressed="false">🔔</button>
      <button class="chip" id="langBtn" aria-label="Language">فا</button>
    </div>
  </header>

  <section class="hero">
    <div class="phase" id="phase"></div>
    <div class="ring">
      <svg viewBox="0 0 100 100" aria-hidden="true">
        <circle cx="50" cy="50" r="46" fill="none" stroke="rgba(255,255,255,.18)" stroke-width="1.2"/>
        <circle id="prog" cx="50" cy="50" r="46" fill="none" stroke="#ffd27a" stroke-width="2" stroke-linecap="round" pathLength="100" stroke-dasharray="0 100" transform="rotate(-90 50 50)"/>
        <circle id="knobGlow" r="4.6" fill="rgba(255,210,122,.3)"/>
        <circle id="knob" r="2.4" fill="#ffd27a" stroke="#fff" stroke-width=".8"/>
      </svg>
      <div class="ring-in">
        <div class="label" id="modeLabel"></div>
        <div class="digits" id="digits">00:00:00</div>
        <div class="sub" id="sub"></div>
      </div>
    </div>
    <div class="upnext" id="upnext"></div>
    <div class="seg" role="group" id="modeSeg">
      <button id="mSince" aria-pressed="true" data-i18n="modeSince"></button>
      <button id="mUntil" aria-pressed="false" data-i18n="modeUntil"></button>
    </div>
    <div class="note" id="polar" hidden></div>
    <div class="dates">
      <div class="h" id="hijri"></div>
      <div class="c" id="civil"></div>
    </div>
    <div class="note" id="liveMsg" hidden></div>
  </section>

  <section class="card">
    <h2 data-i18n="pathTitle"></h2>
    <div class="chart" id="chart"></div>
  </section>

  <section class="card" id="prayerCard">
    <div class="card-head"><h2 data-i18n="prayer"></h2></div>
    <div class="sels">
      <select id="selMethod" aria-label="Method"></select>
      <select id="selAsr" aria-label="Asr"></select>
    </div>
    <div class="pnote" data-i18n="prayerNote"></div>
    <div class="nextbar"><span><span data-i18n="next"></span> · <b id="nextName"></b></span><span class="cd" id="nextCd"></span></div>
    <div class="rows" id="rows"></div>
  </section>

  <section class="card">
    <h2 data-i18n="about"></h2>
    <details open><summary data-i18n="summary"></summary><p data-i18n="summaryText"></p></details>
    <details><summary data-i18n="tech"></summary><p data-i18n="techText"></p></details>
    <details><summary data-i18n="notes"></summary><p data-i18n="notesText"></p></details>
    <details><summary data-i18n="installTitle"></summary><p data-i18n="installText"></p></details>
  </section>

  <footer>🌅 mhsb · Sunset Clock</footer>
</main>

<dialog id="locDlg">
  <div class="sheet">
    <h3 data-i18n="choose"></h3>
    <label><span data-i18n="country"></span><select id="selCountry"></select></label>
    <label id="cityRow"><span data-i18n="city"></span><select id="selCity"></select></label>
    <div id="customRow" hidden style="display:grid;gap:12px">
      <label><span data-i18n="customName"></span><input id="cName" type="text" maxlength="60"></label>
      <div class="grid2">
        <label><span data-i18n="lat"></span><input id="cLat" type="number" step="any" inputmode="decimal"></label>
        <label><span data-i18n="lon"></span><input id="cLon" type="number" step="any" inputmode="decimal"></label>
      </div>
      <label><span data-i18n="tz"></span><input id="cTz" type="text" list="tzList" autocomplete="off" spellcheck="false"></label>
      <datalist id="tzList"></datalist>
    </div>
    <button class="btn" id="gpsBtn" data-i18n="gps"></button>
    <div class="msg" id="locMsg" role="status"></div>
    <div class="actions">
      <button class="btn" id="cancelBtn" data-i18n="cancel"></button>
      <button class="btn primary" id="saveBtn" data-i18n="save"></button>
    </div>
  </div>
</dialog>

/* ---------- State & storage ---------- */
const KEY = 'sunclock:v2';

function defaultState() {

let S = defaultState();
try {

} catch (e) {}

const FA_DIGITS = '۰۱۲۳۴۵۶۷۸۹';

function getLoc() {

    const c = S.custom;
    return { name: c.name || `${c.lat.toFixed(2)}, ${c.lon.toFixed(2)}`, lat: +c.lat, lon: +c.lon, tz: validTz(c.tz) ? c.tz : browserTz };
  }

  const ci = co.cities[S.city] || co.cities[0];
  const li = S.lang === 'fa' ? 1 : 0;
  return { name: `${ci[li]}${S.lang === 'fa' ? '، ' : ', '}${co[S.lang]}`, lat: ci[2], lon: ci[3], tz: ci[4] };

/* ---------- Solar maths (NOAA) ---------- */
function sunPos(ms) {
  const jd = ms / DAY + 2440587.5, Tc = (jd - 2451545) / 36525;
  const L0 = mod(280.46646 + Tc * (36000.76983 + Tc * 0.0003032), 360);
  const M = 357.52911 + Tc * (35999.05029 - 0.0001537 * Tc), Mr = M * rad;
  const e = 0.016708634 - Tc * (0.000042037 + 0.0000001267 * Tc);
  const C = Math.sin(Mr) * (1.914602 - Tc * (0.004817 + 0.000014 * Tc)) + Math.sin(2 * Mr) * (0.019993 - 0.000101 * Tc) + Math.sin(3 * Mr) * 0.000289;
  const om = 125.04 - 1934.136 * Tc;
  const lam = L0 + C - 0.00569 - 0.00478 * Math.sin(om * rad);
  const eps0 = 23 + (26 + (21.448 - Tc * (46.815 + Tc * (0.00059 - Tc * 0.001813))) / 60) / 60;
  const eps = eps0 + 0.00256 * Math.cos(om * rad);
  const decl = Math.asin(Math.sin(eps * rad) * Math.sin(lam * rad));
  const y = Math.tan(eps * rad / 2) ** 2, L0r = L0 * rad;
  const eq = 4 * deg * (y * Math.sin(2 * L0r) - 2 * e * Math.sin(Mr) + 4 * e * y * Math.sin(Mr) * Math.cos(2 * L0r)
    - 0.5 * y * y * Math.sin(4 * L0r) - 1.25 * e * e * Math.sin(2 * Mr));
  return { decl, eq };
}
function altAt(ms, lat, lon) {
  const { decl, eq } = sunPos(ms);
  const tst = mod(mod(ms, DAY) / 60000 + eq + 4 * lon, 1440);
  const ha = (tst / 4 - 180) * rad, la = lat * rad;
  const s = Math.sin(la) * Math.sin(decl) + Math.cos(la) * Math.cos(decl) * Math.cos(ha);
  return { alt: Math.asin(clamp(s, -1, 1)) * deg, morning: tst < 720 };
}
function noonMs(dayMs, lon) {
  let tt = dayMs + (720 - 4 * lon) * 60000;

  return tt;
}
function eventMs(dayMs, lat, lon, altDeg, after) {
  let tt = noonMs(dayMs, lon);
  const la = lat * rad;
  for (let i = 0; i < 3; i++) {
    const { decl, eq } = sunPos(tt);
    const c = (Math.sin(altDeg * rad) - Math.sin(la) * Math.sin(decl)) / (Math.cos(la) * Math.cos(decl));
    if (c > 1 || c < -1) return null;
    tt = dayMs + (720 - 4 * lon - eq + (after ? 1 : -1) * 4 * Math.acos(c) * deg) * 60000;
  }
  return tt;
}
function dayEvents(dayMs, loc, M, asrF) {
  const { lat, lon } = loc;
  const noon = noonMs(dayMs, lon), { decl } = sunPos(noon);
  const asrAlt = Math.atan(1 / (asrF + Math.tan(Math.abs(lat * rad - decl)))) * deg;
  return {
    fajr: eventMs(dayMs, lat, lon, -M.fajr, false),
    sunrise: eventMs(dayMs, lat, lon, -0.833, false),
    dhuhr: noon,
    asr: eventMs(dayMs, lat, lon, asrAlt, true),
    sunset: eventMs(dayMs, lat, lon, -0.833, true),
    maghrib: M.maghrib != null ? eventMs(dayMs, lat, lon, -M.maghrib, true) : null,
    isha: eventMs(dayMs, lat, lon, -M.isha, true),
    midnight: null

}

/* ---------- Sky ---------- */
const STOPS = [
  { a:-18, e:['#04061a','#0a1030'], m:['#04061a','#0a1030'] },
  { a:-12, e:['#0b1043','#252466'], m:['#0a1346','#1f2c6c'] },
  { a:-6,  e:['#1d2a6e','#8a3f80'], m:['#1d3272','#9a5c92'] },
  { a:-0.8,e:['#2d3f90','#e0603f'], m:['#394f9f','#ee8b68'] },
  { a:3,   e:['#4568b5','#f39a48'], m:['#5f87cc','#f6bf78'] },
  { a:12,  e:['#4a82cf','#e8c48f'], m:['#5592da','#eed39b'] },
  { a:30,  e:['#3d85d8','#8fc3ee'], m:['#3d85d8','#8fc3ee'] }

const hex2rgb = h => [1, 3, 5].map(i => parseInt(h.slice(i, i + 2), 16));

  let i = 0; while (alt > STOPS[i + 1].a) i++;
  const A = STOPS[i], B = STOPS[i + 1], f = (alt - A.a) / (B.a - A.a);
  return [mix(A[k][0], B[k][0], f), mix(A[k][1], B[k][1], f)];
}
const skyEl = $('sky'), glowEl = $('glow'), starsEl = $('stars');

  let h = '';
  for (let i = 0; i < 80; i++) {
    const s = (Math.random() * 1.8 + 0.8).toFixed(1);

  }

function paintSky(alt, morning) {

function rgbToHex(s) { return '#' + s.match(/\d+/g).slice(0, 3).map(n => (+n).toString(16).padStart(2, '0')).join(''); }

/* ---------- Formatting ---------- */
const fmtCache = {};
const timeFmt = tz => fmtCache['t' + tz] || (fmtCache['t' + tz] = new Intl.DateTimeFormat('en-GB', { timeZone: tz, hour: '2-digit', minute: '2-digit', hourCycle: 'h23' }));

const hm = (ms, tz) => ms == null ? '—' : D(timeFmt(tz).format(new Date(ms + 30000)));
const pad = n => String(n).padStart(2, '0');
function hms(ms) {
  const s = Math.max(0, Math.floor(ms / 1000));

}
function phaseKey(a) { return a > 6 ? 'day' : a > -0.833 ? 'golden' : a > -6 ? 'civil' : a > -12 ? 'nautical' : a > -18 ? 'astro' : 'night'; }

/* ---------- Context (events for the current solar day) ---------- */
const KEYS = ['fajr', 'sunrise', 'dhuhr', 'asr', 'sunset', 'maghrib', 'isha', 'midnight'];
let ctx = null;
function buildCtx(now, loc) {
  const sd = Math.floor((now + loc.lon * 240000) / DAY) * DAY;
  const key = [sd, loc.lat, loc.lon, S.method, S.asr].join('|');
  if (ctx && ctx.key === key) return ctx;
  const M = METHODS[S.method], days = [];
  for (let k = -1; k <= 2; k++) days.push(dayEvents(sd + k * DAY, loc, M, S.asr));
  for (let i = 0; i < 3; i++) {
    const d = days[i], n = days[i + 1], end = M.mid === 'jafari' ? n.fajr : n.sunrise;
    d.midnight = (d.sunset != null && end != null) ? (d.sunset + end) / 2 : null;
  }
  const flat = [];
  days.forEach((d, i) => KEYS.forEach(k => { if (d[k] != null) flat.push({ k, ms: d[k], day: i }); }));
  flat.sort((a, b) => a.ms - b.ms);
  const ss = [0, 1, 2].map(i => days[i].sunset != null ? days[i].sunset : days[i].dhuhr + 6 * HOUR);
  const polar = [0, 1, 2].some(i => days[i].sunset == null);
  ctx = { key, sd, days, flat, ss, polar };
  return ctx;
}

/* ---------- Rendering ---------- */
const el = { digits: $('digits'), modeLabel: $('modeLabel'), sub: $('sub'), phase: $('phase'), prog: $('prog'), knob: $('knob'), knobGlow: $('knobGlow'),
  hijri: $('hijri'), civil: $('civil'), chart: $('chart'), rows: $('rows'), nextName: $('nextName'), nextCd: $('nextCd'), polar: $('polar'), locName: $('locName'), upnext: $('upnext') };
let sigRows = '', sigChart = '', chartInfo = null;

function renderDates(now, tz, last) {
  const fa = S.lang === 'fa';
  const ymd = ymdFmt(tz).format(new Date(now));
  const [y, m, d] = ymd.split('-').map(Number);
  const base = Date.UTC(y, m - 1, d, 12);
  const afterSunset = ymdFmt(tz).format(new Date(last)) === ymd;
  let h = '', c = '';
  try {
    h = new Intl.DateTimeFormat((fa ? 'fa-IR' : 'en-US') + '-u-ca-islamic-umalqura', { timeZone: 'UTC', day: 'numeric', month: 'long', year: 'numeric' })
      .format(new Date(base + (afterSunset ? DAY : 0)));
  } catch (e) {}
  try {
    c = new Intl.DateTimeFormat(fa ? 'fa-IR-u-ca-persian' : 'en-US', { timeZone: 'UTC', weekday: 'long', day: 'numeric', month: 'long', year: 'numeric' }).format(new Date(base));
  } catch (e) {}
  el.hijri.textContent = h ? '🌙 ' + h : '';
  el.civil.textContent = c;
}

function buildChart(last, next, loc, c) {
  const N = 96, W = 340, H = 140, top = 10, bot = 4;
  const samples = [];
  for (let i = 0; i <= N; i++) samples.push(altAt(last + (next - last) * i / N, loc.lat, loc.lon).alt);
  const amax = Math.max(10, ...samples), amin = Math.min(-10, ...samples);
  const Y = a => top + (amax - a) / (amax - amin) * (H - top - bot);
  const y0 = Y(0);
  let line = '';
  samples.forEach((a, i) => { line += (i ? 'L' : 'M') + (i / N * W).toFixed(1) + ' ' + Y(a).toFixed(1); });
  const area = `${line}L${W} ${y0.toFixed(1)}L0 ${y0.toFixed(1)}Z`;
  el.chart.innerHTML = `
    <svg viewBox="0 0 ${W} ${H}" role="img" aria-label="${t('pathTitle')}">
      <defs><clipPath id="clipDay"><rect x="0" y="0" width="${W}" height="${y0.toFixed(1)}"/></clipPath></defs>
      <rect x="0" y="${y0.toFixed(1)}" width="${W}" height="${(H - y0).toFixed(1)}" fill="rgba(0,0,0,.22)" rx="0"/>
      <path d="${area}" fill="rgba(255,214,140,.30)" clip-path="url(#clipDay)"/>
      <line x1="0" x2="${W}" y1="${y0.toFixed(1)}" y2="${y0.toFixed(1)}" stroke="rgba(255,255,255,.55)" stroke-dasharray="3 4"/>
      <path d="${line}" fill="none" stroke="#fff" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>
      <g id="mk"><circle r="11" fill="rgba(255,210,122,.3)"/><circle r="5.5" fill="#ffd27a" stroke="#fff" stroke-width="1.5"/></g>
    </svg>`;
  const noon = c.flat.find(e => e.k === 'dhuhr' && e.ms > last && e.ms < next);
  const foot = document.createElement('div');
  foot.className = 'chart-foot';
  foot.innerHTML = `<span class="l">${t('ev').sunset} ${hm(last, loc.tz)}</span>` +
    (noon ? `<span class="m" style="left:${((noon.ms - last) / (next - last) * 100).toFixed(1)}%">${t('noon')} ${hm(noon.ms, loc.tz)}</span>` : '') +
    `<span class="r">${t('ev').sunset} ${hm(next, loc.tz)}</span>`;
  el.chart.appendChild(foot);
  chartInfo = { last, next, Y, W, mk: el.chart.querySelector('#mk') };
}

function offs(ms, last) {
  const m = Math.round((ms - last) / 60000);
  return D(`${pad(Math.floor(m / 60))}:${pad(m % 60)}`);
}
function renderRows(now, loc, c, nextEv, last, next) {
  const items = [{ k: 'sunset', ms: last }]
    .concat(c.flat.filter(e => e.k !== 'sunset' && e.ms > last && e.ms < next))
    .concat([{ k: 'sunset', ms: next, end: true }]);
  el.rows.innerHTML = items.map(e => {
    const cls = ['row'];
    if (e.k === 'sunrise' || e.k === 'midnight' || e.end) cls.push('minor');
    if (e.ms <= now) cls.push('passed');
    if (nextEv && nextEv.ms === e.ms && nextEv.k === e.k) cls.push('next');
    const name = e.end ? t('nextSunset') : t('ev')[e.k];
    return `<div class="${cls.join(' ')}"><span>${name}</span><span class="vals"><span class="lc">${hm(e.ms, loc.tz)}</span><span class="tm">${offs(e.ms, last)}</span></span></div>`;
  }).join('');
}

function render() {
  const now = Date.now(), loc = getLoc(), c = buildCtx(now, loc);
  const last = Math.max(...c.ss.filter(x => x <= now)), next = Math.min(...c.ss.filter(x => x > now));
  const sun = altAt(now, loc.lat, loc.lon);

  // clock
  const since = S.mode === 'since';
  const clockText = hms(since ? now - last : next - now);
  el.digits.textContent = clockText;
  el.modeLabel.textContent = since ? t('since') : t('until');
  const pct = clamp((now - last) / (next - last), 0, 1);
  el.prog.setAttribute('stroke-dasharray', `${(pct * 100).toFixed(2)} 100`);
  const ang = pct * 2 * Math.PI - Math.PI / 2, kx = 50 + 46 * Math.cos(ang), ky = 50 + 46 * Math.sin(ang);
  [el.knob, el.knobGlow].forEach(n => { n.setAttribute('cx', kx.toFixed(2)); n.setAttribute('cy', ky.toFixed(2)); });
  el.sub.textContent = `${t('lastSunset')} ${c.polar ? '≈' : ''}${hm(last, loc.tz)}  ·  ${t('nextSunset')} ${c.polar ? '≈' : ''}${hm(next, loc.tz)}`;
  el.polar.hidden = !c.polar; el.polar.textContent = t('polar');
  document.title = `${clockText} · ${t('title')}`;

  // phase + sky
  const altTxt = D(Math.abs(sun.alt).toFixed(1)) + '° ' + (sun.alt >= 0 ? t('above') : t('below'));
  el.phase.textContent = `${t('ph')[phaseKey(sun.alt)]} · ${t('sunAlt')} ${altTxt}`;
  paintSky(sun.alt, sun.morning);

  renderDates(now, loc.tz, last);

  // chart
  const cs = [last, S.lang, loc.tz].join('|');
  if (cs !== sigChart) { sigChart = cs; buildChart(last, next, loc, c); }
  if (chartInfo && chartInfo.mk) {
    const x = (now - chartInfo.last) / (chartInfo.next - chartInfo.last) * chartInfo.W;
    chartInfo.mk.setAttribute('transform', `translate(${x.toFixed(1)} ${chartInfo.Y(sun.alt).toFixed(1)})`);
  }

  // prayer times
  const nextEv = c.flat.find(e => e.ms > now);
  const rs = [c.key, S.lang, last, nextEv ? nextEv.ms : 0].join('|');
  if (rs !== sigRows) { sigRows = rs; renderRows(now, loc, c, nextEv, last, next); }
  if (nextEv) { el.nextName.textContent = t('ev')[nextEv.k]; el.nextCd.textContent = hms(nextEv.ms - now); }

  // upcoming prayer, expressed on the sunset clock
  const tgt = (nextEv && nextEv.ms <= next) ? nextEv : { k: 'sunset', ms: next };
  const uName = t('ev')[tgt.k], uOff = offs(tgt.ms, last), uCd = hms(tgt.ms - now);
  el.upnext.innerHTML = upText(uName, uOff, uCd, true);
  if (live.on) updateLive(`${clockText}  ${since ? t('modeSince') : t('modeUntil')}`, upText(uName, uOff, uCd, false), loc.name);
}

/* ---------- UI wiring ---------- */
function fillStatic() {
  document.documentElement.lang = S.lang;
  document.documentElement.dir = S.lang === 'fa' ? 'rtl' : 'ltr';
  document.querySelectorAll('[data-i18n]').forEach(n => { n.textContent = t(n.dataset.i18n); });
  $('langBtn').textContent = S.lang === 'fa' ? 'EN' : 'فا';
  $('langBtn').setAttribute('aria-label', S.lang === 'fa' ? 'English' : 'فارسی');
  $('selMethod').innerHTML = Object.keys(METHODS).map(k => `<option value="${k}">${t('me')[k]}</option>`).join('');
  $('selMethod').value = S.method;
  $('selAsr').innerHTML = `<option value="1">${t('asrStd')}</option><option value="2">${t('asrHan')}</option>`;
  $('selAsr').value = String(S.asr);
  $('locName').textContent = getLoc().name;
  $('liveBtn').title = t('liveLabel'); $('liveBtn').setAttribute('aria-label', t('liveLabel'));
  $('installBtn').title = t('installLabel'); $('installBtn').setAttribute('aria-label', t('installLabel'));
  $('mSince').setAttribute('aria-pressed', S.mode === 'since');
  $('mUntil').setAttribute('aria-pressed', S.mode === 'until');
}
function refresh() { sigRows = ''; sigChart = ''; fillStatic(); render(); }

$('langBtn').onclick = () => { S.lang = S.lang === 'fa' ? 'en' : 'fa'; persist(); refresh(); };
$('mSince').onclick = () => { S.mode = 'since'; persist(); fillStatic(); render(); };
$('mUntil').onclick = () => { S.mode = 'until'; persist(); fillStatic(); render(); };
$('selMethod').onchange = e => { S.method = e.target.value; persist(); refresh(); };
$('selAsr').onchange = e => { S.asr = +e.target.value; persist(); refresh(); };

// Location dialog
const dlg = $('locDlg'), selCountry = $('selCountry'), selCity = $('selCity');
function fillCities() {
  const isCustom = selCountry.value === 'custom';
  $('cityRow').hidden = isCustom; $('customRow').hidden = !isCustom;
  if (!isCustom) {
    const co = COUNTRIES.find(c => c.id === selCountry.value), li = S.lang === 'fa' ? 1 : 0;
    selCity.innerHTML = co.cities.map((c, i) => `<option value="${i}">${c[li]}</option>`).join('');
    selCity.value = (S.country === co.id) ? S.city : 0;
  }
}
function openDialog() {
  dlg.querySelectorAll('[data-i18n]').forEach(n => { n.textContent = t(n.dataset.i18n); });
  selCountry.innerHTML = COUNTRIES.map(c => `<option value="${c.id}">${c[S.lang]}</option>`).join('') + `<option value="custom">${t('custom')}</option>`;
  selCountry.value = S.country;
  $('cName').value = S.custom.name || ''; $('cLat').value = S.custom.lat; $('cLon').value = S.custom.lon; $('cTz').value = S.custom.tz || browserTz;
  $('locMsg').textContent = '';
  fillCities();
  dlg.showModal();
}
selCountry.onchange = fillCities;
$('locBtn').onclick = openDialog;
$('cancelBtn').onclick = () => dlg.close();
dlg.addEventListener('click', e => { if (e.target === dlg) dlg.close(); });
try {
  if (Intl.supportedValuesOf) $('tzList').innerHTML = Intl.supportedValuesOf('timeZone').map(z => `<option value="${z}">`).join('');
} catch (e) {}

$('gpsBtn').onclick = () => {
  const msg = $('locMsg');
  if (!navigator.geolocation) { msg.textContent = t('gpsFail'); return; }
  msg.textContent = t('gpsWait');
  navigator.geolocation.getCurrentPosition(p => {
    selCountry.value = 'custom'; fillCities();
    $('cName').value = t('myLoc'); $('cLat').value = p.coords.latitude.toFixed(4); $('cLon').value = p.coords.longitude.toFixed(4); $('cTz').value = browserTz;
    msg.textContent = t('gpsOk');
  }, () => { msg.textContent = t('gpsFail'); }, { enableHighAccuracy: false, timeout: 10000, maximumAge: 600000 });
};

$('saveBtn').onclick = () => {
  const c = selCountry.value, prev = S.country;
  if (c === 'custom') {
    const lat = parseFloat($('cLat').value), lon = parseFloat($('cLon').value), tz = $('cTz').value.trim() || browserTz;
    if (!(lat >= -90 && lat <= 90) || !(lon >= -180 && lon <= 180)) { $('locMsg').textContent = t('badCoords'); return; }
    if (!validTz(tz)) { $('locMsg').textContent = t('badTz'); return; }
    S.custom = { name: $('cName').value.trim(), lat, lon, tz };
    S.country = 'custom';
  } else {
    S.country = c; S.city = +selCity.value;
  }
  if (S.country !== prev) {
    if (S.country === 'ir') S.method = 'tehran';
    else if (S.method === 'tehran') S.method = 'mwl';
  }
  persist(); dlg.close(); ctx = null; refresh();
};

document.addEventListener('visibilitychange', () => { if (!document.hidden) render(); });

function upText(name, off, cd, html) {
  const w = s => html ? `<span class="ltr">${s}</span>` : s;
  return S.lang === 'fa'
    ? `${t('next')}: ${name} · ${w(off)} ${t('afterSunset')} · ${w(cd)} مانده`
    : `${t('next')}: ${name} · ${w(off)} ${t('afterSunset')} · in ${w(cd)}`;
}

/* ---------- PWA: install, offline, live notification ---------- */
let deferredPrompt = null;
window.addEventListener('beforeinstallprompt', e => { e.preventDefault(); deferredPrompt = e; $('installBtn').hidden = false; });
window.addEventListener('appinstalled', () => { $('installBtn').hidden = true; });
$('installBtn').onclick = async () => {
  if (!deferredPrompt) return;
  deferredPrompt.prompt();
  try { await deferredPrompt.userChoice; } catch (e) {}
  deferredPrompt = null; $('installBtn').hidden = true;
};
if ('serviceWorker' in navigator && (location.protocol === 'https:' || location.hostname === 'localhost')) {
  window.addEventListener('load', () => { navigator.serviceWorker.register('sw.js').catch(() => {}); });
}

// The "live notification" is a Media Session: a silent looping track keeps the page alive and
// the OS shows its title/artist in the notification shade, lock screen and media controls.
const live = { on: false, audio: null, url: null, key: '' };
const liveMsg = $('liveMsg');
function setLiveMsg(s) { liveMsg.hidden = !s; liveMsg.textContent = s || ''; }
function silentWavUrl() {
  const sr = 8000, n = sr * 10, buf = new ArrayBuffer(44 + n), v = new DataView(buf);
  const w = (o, s) => { for (let i = 0; i < s.length; i++) v.setUint8(o + i, s.charCodeAt(i)); };
  w(0, 'RIFF'); v.setUint32(4, 36 + n, true); w(8, 'WAVE'); w(12, 'fmt '); v.setUint32(16, 16, true);
  v.setUint16(20, 1, true); v.setUint16(22, 1, true); v.setUint32(24, sr, true); v.setUint32(28, sr, true);
  v.setUint16(32, 1, true); v.setUint16(34, 8, true); w(36, 'data'); v.setUint32(40, n, true);
  new Uint8Array(buf, 44).fill(128);
  return URL.createObjectURL(new Blob([buf], { type: 'audio/wav' }));
}
function updateLive(title, artist, album) {
  const key = title + '|' + artist;
  if (key === live.key) return;
  live.key = key;
  try {
    navigator.mediaSession.metadata = new MediaMetadata({
      title, artist, album,
      artwork: [{ src: 'icon-192.png', sizes: '192x192', type: 'image/png' }, { src: 'icon-512.png', sizes: '512x512', type: 'image/png' }]
    });
  } catch (e) {}
}
async function startLive() {
  if (!('mediaSession' in navigator)) { setLiveMsg(t('liveFail')); return; }
  try {
    if (!live.url) live.url = silentWavUrl();
    const a = live.audio || (live.audio = new Audio(live.url));
    a.loop = true;
    await a.play();
    live.on = true; live.key = '';
    const ms = navigator.mediaSession;
    ms.playbackState = 'playing';
    ['pause', 'stop'].forEach(n => { try { ms.setActionHandler(n, () => stopLive()); } catch (e) {} });
    try { ms.setActionHandler('play', () => startLive()); } catch (e) {}
    ['seekbackward', 'seekforward', 'seekto', 'previoustrack', 'nexttrack'].forEach(n => { try { ms.setActionHandler(n, null); } catch (e) {} });
    try { ms.setPositionState(); } catch (e) {}
    $('liveBtn').setAttribute('aria-pressed', 'true');
    setLiveMsg(t('liveOn'));
    render();
  } catch (e) { live.on = false; setLiveMsg(t('liveFail')); }
}
function stopLive() {
  live.on = false;
  try { live.audio && live.audio.pause(); } catch (e) {}
  try { navigator.mediaSession.metadata = null; navigator.mediaSession.playbackState = 'none'; } catch (e) {}
  $('liveBtn').setAttribute('aria-pressed', 'false');
  setLiveMsg('');
}
$('liveBtn').onclick = () => (live.on ? stopLive() : startLive());

fillStatic();
render();
setInterval(render, 250);
})();
</script>
</body>
</html>
